name: CHRONOS Specimen Validation

on:
  push:
    branches: [main]
    paths:
      - 'specimens/**'
      - 'methodology/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'specimens/**'
      - 'methodology/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'

jobs:
  validate-specimens:
    runs-on: ubuntu-latest
    name: Validate Specimen Structure and Governance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation dependency
        run: pip install jsonschema

      # The validator supports legacy evidence layouts without altering source artifacts.
      - name: Validate all specimens
        run: python scripts/validate_chronos.py

      - name: Confirm governance documents
        run: |
          test -f methodology/repository-governance-standard.md
          test -f methodology/specimen-lifecycle-and-review.md
          test -f methodology/future-specimen-template.md
          echo "CHRONOS governance documents present"
